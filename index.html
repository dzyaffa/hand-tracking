<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cyber Frame Finger Tracking</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace; color: #7CFFF0;
    width: 100%; height: 100%;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #overlay-ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    font-size: 12px; letter-spacing: 1px; text-shadow: 0 0 6px #0ff;
    pointer-events: none;
  }
  #status {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #7CFFF0; text-shadow: 0 0 6px #0ff;
    z-index: 10; text-align: center; width: 90%; pointer-events: none;
  }
  #loading {
    position: absolute; z-index: 20; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #7CFFF0; font-size: 14px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">Loading model...</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay-ui">
    CYBER FRAME // <span id="frameStatus">STANDBY</span><br>
    HAND FRAME ACQUIRED: <span id="handCount">0</span>
  </div>
  <div id="status">1 tangan: pinch jempol+telunjuk. 2 tangan: bentuk kotak</div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const frameStatusEl = document.getElementById("frameStatus");
const handCountEl = document.getElementById("handCount");
const loadingEl = document.getElementById("loading");

let handLandmarker;
let lastVideoTime = -1;
let srcRect = { x: 0, y: 0, w: 0, h: 0 }; // area video native yang dicrop biar "cover" pas di canvas

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  computeCoverCrop();
}
window.addEventListener("resize", resizeCanvas);

function computeCoverCrop() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const canvasAspect = canvas.width / canvas.height;
  const videoAspect = vw / vh;
  let cw, ch;
  if (videoAspect > canvasAspect) {
    ch = vh;
    cw = vh * canvasAspect;
  } else {
    cw = vw;
    ch = vw / canvasAspect;
  }
  srcRect = { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

// convert normalized landmark (0..1 relatif ke frame video penuh) -> koordinat canvas (px), sudah termirror
function toCanvasXY(lm) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const px = lm.x * vw, py = lm.y * vh;
  const relX = (px - srcRect.x) / srcRect.w;
  const relY = (py - srcRect.y) / srcRect.h;
  const cx = canvas.width - relX * canvas.width; // mirror horizontal
  const cy = relY * canvas.height;
  return { x: cx, y: cy };
}

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });

  await startCamera();
  loadingEl.style.display = "none";
  requestAnimationFrame(loop);
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(resolve => {
    if (video.videoWidth) return resolve();
    video.onloadedmetadata = () => resolve();
  });
  resizeCanvas();
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// --- efek 2 tangan: quad yang narik dari ujung jempol & telunjuk tiap tangan ---
// urutan titik: leftThumb -> rightThumb -> rightIndex -> leftIndex -> tutup ke leftThumb
function drawQuadFrame(leftThumb, leftIndex, rightThumb, rightIndex, t) {
  const pts = [leftThumb, rightThumb, rightIndex, leftIndex];

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();

  // isi transparan
  ctx.fillStyle = "rgba(10, 20, 30, 0.35)";
  ctx.fill();

  // garis putus-putus tipis buat semua sisi
  ctx.setLineDash([5, 5]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "rgba(124,255,240,0.6)";
  ctx.stroke();
  ctx.setLineDash([]);

  // highlight garis bawah (jempol-jempol) lebih tebal & nyala, ciri khas efeknya
  ctx.beginPath();
  ctx.moveTo(leftThumb.x, leftThumb.y);
  ctx.lineTo(rightThumb.x, rightThumb.y);
  ctx.strokeStyle = "#7CFFF0";
  ctx.lineWidth = 4;
  ctx.shadowColor = "#7CFFF0";
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // dot di tiap sudut
  ctx.fillStyle = "#7CFFF0";
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // label di dekat sisi atas (index-index)
  const midTopX = (leftIndex.x + rightIndex.x) / 2;
  const midTopY = (leftIndex.y + rightIndex.y) / 2;
  ctx.save();
  ctx.font = "11px monospace";
  ctx.fillStyle = "#7CFFF0";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 4;
  ctx.textAlign = "center";
  ctx.fillText("CYBER FRAME // ACTIVE", midTopX, midTopY - 12);
  ctx.restore();
}

function drawHandPoints(landmarks) {
  ctx.fillStyle = "rgba(124,255,240,0.7)";
  landmarks.forEach(pt => {
    const c = toCanvasXY(pt);
    ctx.beginPath();
    ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function loop() {
  if (video.currentTime !== lastVideoTime && video.videoWidth) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const result = handLandmarker.detectForVideo(video, now);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let statusText = "STANDBY";

    if (result.landmarks && result.landmarks.length > 0) {
      handCountEl.textContent = result.landmarks.length;

      if (result.landmarks.length >= 2) {
        // 2 tangan kedeteksi -> tarik quad dari 4 titik fingertip (thumb+index tiap tangan)
        const hand0 = result.landmarks[0];
        const hand1 = result.landmarks[1];
        drawHandPoints(hand0);
        drawHandPoints(hand1);

        const h0Thumb = toCanvasXY(hand0[4]);
        const h0Index = toCanvasXY(hand0[8]);
        const h1Thumb = toCanvasXY(hand1[4]);
        const h1Index = toCanvasXY(hand1[8]);

        // tentuin mana yang "kiri" & "kanan" berdasar posisi x di canvas
        let leftThumb, leftIndex, rightThumb, rightIndex;
        if (h0Thumb.x <= h1Thumb.x) {
          leftThumb = h0Thumb; leftIndex = h0Index;
          rightThumb = h1Thumb; rightIndex = h1Index;
        } else {
          leftThumb = h1Thumb; leftIndex = h1Index;
          rightThumb = h0Thumb; rightIndex = h0Index;
        }

        drawQuadFrame(leftThumb, leftIndex, rightThumb, rightIndex, now);
        statusText = "ACTIVE (2 HANDS)";
      } else {
        // cuma 1 tangan -> mati total, ga gambar apa-apa
        statusText = "STANDBY (1 HAND)";
      }
    } else {
      handCountEl.textContent = "0";
    }

    frameStatusEl.textContent = statusText;
  }
  requestAnimationFrame(loop);
}

init().catch(err => {
  loadingEl.textContent = "Gagal load kamera/model: " + err.message;
  console.error(err);
});
</script>
</body>
</html>
