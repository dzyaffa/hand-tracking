<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cyber Frame Finger Tracking</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace; color: #7CFFF0;
    width: 100%; height: 100%;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #overlay-ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    font-size: 12px; letter-spacing: 1px; text-shadow: 0 0 6px #0ff;
    pointer-events: none;
  }
  #status {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #7CFFF0; text-shadow: 0 0 6px #0ff;
    z-index: 10; text-align: center; width: 90%; pointer-events: none;
  }
  #loading {
    position: absolute; z-index: 20; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #7CFFF0; font-size: 14px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">Loading model...</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay-ui">
    CYBER FRAME // <span id="frameStatus">STANDBY</span><br>
    HAND FRAME ACQUIRED: <span id="handCount">0</span>
  </div>
  <div id="status">1 tangan: pinch jempol+telunjuk. 2 tangan: bentuk kotak</div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const frameStatusEl = document.getElementById("frameStatus");
const handCountEl = document.getElementById("handCount");
const loadingEl = document.getElementById("loading");

let handLandmarker;
let lastVideoTime = -1;
let srcRect = { x: 0, y: 0, w: 0, h: 0 }; // area video native yang dicrop biar "cover" pas di canvas

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  computeCoverCrop();
}
window.addEventListener("resize", resizeCanvas);

function computeCoverCrop() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const canvasAspect = canvas.width / canvas.height;
  const videoAspect = vw / vh;
  let cw, ch;
  if (videoAspect > canvasAspect) {
    ch = vh;
    cw = vh * canvasAspect;
  } else {
    cw = vw;
    ch = vw / canvasAspect;
  }
  srcRect = { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

// convert normalized landmark (0..1 relatif ke frame video penuh) -> koordinat canvas (px), sudah termirror
function toCanvasXY(lm) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const px = lm.x * vw, py = lm.y * vh;
  const relX = (px - srcRect.x) / srcRect.w;
  const relY = (py - srcRect.y) / srcRect.h;
  const cx = canvas.width - relX * canvas.width; // mirror horizontal
  const cy = relY * canvas.height;
  return { x: cx, y: cy };
}

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });

  await startCamera();
  loadingEl.style.display = "none";
  requestAnimationFrame(loop);
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(resolve => {
    if (video.videoWidth) return resolve();
    video.onloadedmetadata = () => resolve();
  });
  resizeCanvas();
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// --- efek 1 tangan: bar cyber di antara jempol & telunjuk ---
function drawFingerBar(p1, p2, t) {
  const x1 = p1.x, y1 = p1.y;
  const x2 = p2.x, y2 = p2.y;
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  const gap = Math.hypot(x2 - x1, y2 - y1);
  const length = gap * 1.15;
  const barHeight = length * 0.32;
  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.fillStyle = "rgba(10, 20, 30, 0.5)";
  ctx.fillRect(-length / 2, -barHeight / 2, length, barHeight);

  ctx.strokeStyle = "rgba(124, 255, 240, 0.5)";
  ctx.lineWidth = 1;
  for (let y = -barHeight / 2; y <= barHeight / 2; y += 4) {
    ctx.beginPath();
    ctx.moveTo(-length / 2, y);
    ctx.lineTo(length / 2, y);
    ctx.stroke();
  }

  const scanX = -length / 2 + ((t / 6) % length);
  const grad = ctx.createLinearGradient(scanX - 15, 0, scanX + 15, 0);
  grad.addColorStop(0, "rgba(124,255,240,0)");
  grad.addColorStop(0.5, "rgba(124,255,240,0.9)");
  grad.addColorStop(1, "rgba(124,255,240,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(-length / 2, -barHeight / 2, length, barHeight);

  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = "#7CFFF0";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#7CFFF0";
  ctx.shadowBlur = 10;
  ctx.strokeRect(-length / 2, -barHeight / 2, length, barHeight);
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.save();
  ctx.font = "11px monospace";
  ctx.fillStyle = "#7CFFF0";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 4;
  ctx.textAlign = "center";
  ctx.fillText("CYBER FRAME // ACTIVE", cx, cy - barHeight / 2 - 14 - Math.abs(Math.sin(angle)) * 10);
  ctx.restore();
}

// --- efek 2 tangan: kotak viewfinder yang berubah sesuai jarak jempol+telunjuk ---
function drawViewfinderBox(points, t) {
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = maxX - minX, h = maxY - minY;
  const bracket = Math.min(w, h) * 0.22;

  ctx.save();
  ctx.strokeStyle = "#7CFFF0";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#7CFFF0";
  ctx.shadowBlur = 10;

  // 4 sudut bracket ala viewfinder kamera
  const corners = [
    { x: minX, y: minY, dx: 1, dy: 1 },
    { x: maxX, y: minY, dx: -1, dy: 1 },
    { x: minX, y: maxY, dx: 1, dy: -1 },
    { x: maxX, y: maxY, dx: -1, dy: -1 }
  ];
  corners.forEach(c => {
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + bracket * c.dy);
    ctx.lineTo(c.x, c.y);
    ctx.lineTo(c.x + bracket * c.dx, c.y);
    ctx.stroke();
  });

  // garis putus-putus tipis buat border penuh
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(124,255,240,0.4)";
  ctx.shadowBlur = 0;
  ctx.strokeRect(minX, minY, w, h);
  ctx.setLineDash([]);

  // scan line horizontal bergerak vertikal
  const scanY = minY + ((t / 8) % h);
  ctx.strokeStyle = "rgba(124,255,240,0.8)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(minX, scanY);
  ctx.lineTo(maxX, scanY);
  ctx.stroke();

  ctx.restore();

  ctx.save();
  ctx.font = "11px monospace";
  ctx.fillStyle = "#7CFFF0";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 4;
  ctx.textAlign = "left";
  ctx.fillText("FRAME LOCKED // " + Math.round(w) + "x" + Math.round(h), minX, minY - 10);
  ctx.restore();
}

function drawHandPoints(landmarks) {
  ctx.fillStyle = "rgba(124,255,240,0.7)";
  landmarks.forEach(pt => {
    const c = toCanvasXY(pt);
    ctx.beginPath();
    ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function loop() {
  if (video.currentTime !== lastVideoTime && video.videoWidth) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const result = handLandmarker.detectForVideo(video, now);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let statusText = "STANDBY";

    if (result.landmarks && result.landmarks.length > 0) {
      handCountEl.textContent = result.landmarks.length;
      result.landmarks.forEach(lm => drawHandPoints(lm));

      if (result.landmarks.length >= 2) {
        // mode 2 tangan: kotak viewfinder dari titik jempol+telunjuk tiap tangan
        const pts = [];
        result.landmarks.slice(0, 2).forEach(lm => {
          pts.push(toCanvasXY(lm[4]));  // thumb tip
          pts.push(toCanvasXY(lm[8]));  // index tip
        });
        drawViewfinderBox(pts, now);
        statusText = "FRAME LOCKED (2 HANDS)";
      } else {
        // mode 1 tangan: bar antar jempol & telunjuk kalau pinch pas
        const lm = result.landmarks[0];
        const thumbTip = toCanvasXY(lm[4]);
        const indexTip = toCanvasXY(lm[8]);
        const d = dist(thumbTip, indexTip);
        const refSize = Math.min(canvas.width, canvas.height);
        if (d > refSize * 0.03 && d < refSize * 0.32) {
          drawFingerBar(thumbTip, indexTip, now);
          statusText = "ACTIVE (1 HAND)";
        }
      }
    } else {
      handCountEl.textContent = "0";
    }

    frameStatusEl.textContent = statusText;
  }
  requestAnimationFrame(loop);
}

init().catch(err => {
  loadingEl.textContent = "Gagal load kamera/model: " + err.message;
  console.error(err);
});
</script>
</body>
</html>
